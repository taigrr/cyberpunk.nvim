name: ci

on:
  push:
    branches:
      - master
      - 'cd/**'
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check formatting with StyLua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua colors tests

      - name: Lint with Luacheck
        uses: lunarmodules/luacheck@v1
        with:
          args: lua colors tests

      - name: Check for whitespace errors
        run: git diff --check --exit-code

  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.8.3, stable]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Run headless smoke tests
        run: |
          for test in tests/*.lua; do
            CYBERPUNK_TEST="$test" nvim --headless -u NONE \
              -c 'lua local ok, err = pcall(dofile, vim.env.CYBERPUNK_TEST); if not ok then print(err); vim.cmd("cquit 1") end' \
              -c 'qa!'
          done
