name: ci

on:
  push:
    branches:
      - master
      - 'cd/**'
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check formatting with StyLua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua colors tests

      - name: Lint with Luacheck
        uses: lunarmodules/luacheck@v1
        with:
          args: lua colors tests

      - name: Check for whitespace errors
        run: git diff --check --exit-code

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Run headless smoke test
        run: nvim --headless -u NONE '+lua dofile("tests/smoke.lua")' '+qa'
