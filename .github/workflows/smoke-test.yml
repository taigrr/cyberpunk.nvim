name: smoke-test

on:
  push:
    branches:
      - master
      - 'cd/**'
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Neovim
        run: |
          sudo apt-get update
          sudo apt-get install -y neovim

      - name: Run headless smoke test
        run: nvim --headless -u NONE '+lua dofile("tests/smoke.lua")' '+qa'
